name: INTERNET SOURCE - compile Rubika SAF Android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Source verification - Rubingo MIT downloaded from internet
        shell: bash
        run: |
          set -euo pipefail
          test -s server/rubingo/rubingo.go
          test -s server/RUBINGO_LICENSE.txt
          grep -Fq 'MIT License' server/RUBINGO_LICENSE.txt
          ! grep -RIl 'com.sinicable.threeib' app/ || exit 1
          test ! -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK API 35
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Compile NEW Android source (no previous APK)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK package identity and signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Rubika-SAF-INTERNET-SOURCE-v1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging dist/*.apk > dist/APK-METADATA.txt
          grep -Fq "package: name='com.rubiqueq.saf'" dist/APK-METADATA.txt
          grep -Fq "versionName='1.0.0'" dist/APK-METADATA.txt
          grep -Fq "launchable-activity:" dist/APK-METADATA.txt
          git archive --format=zip --prefix=Rubika-SAF-INTERNET-SOURCE/ HEAD > dist/Rubika-SAF-FULL-SOURCE-v1.0.0.zip
          printf 'Rubingo MIT upstream: https://github.com/farshadnobody/Rubingo\nPinned upstream commit: 39f780813e558f390a9404964e1d9ec80748e66f\nBuilt from locally checked-in source; no old APK reused.\nAndroid package: com.rubiqueq.saf\nCI debug signing, not stable release signing.\nRubika account login, Excel recipient resolution and live message delivery not verified.\n' > dist/BUILD-INFO.txt
          (cd dist && sha256sum *.apk *.zip > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Rubika-SAF-FRESH-APK-and-full-source
          path: dist/
          retention-days: 30

      - name: Release uniquely compiled APK and public source
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rubika-saf-internet-source-v1.0.0-build${{ github.run_number }}
          name: Rubika SAF v1.0.0 - INTERNET SOURCE build ${{ github.run_number }}
          prerelease: true
          body: |
            NEW APK compiled from independently authored Android client and the downloaded MIT Rubingo Go source.
            Original upstream: https://github.com/farshadnobody/Rubingo (commit 39f780813e558f390a9404964e1d9ec80748e66f).
            NOT a copy of any previous THREE IB APK.
            Debug signed. External Rubika authentication and actual message delivery unverified.
          files: dist/*
